name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check src/index.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  camera-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same ESP-IDF image as camera-node/.devcontainer
      - uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: camera-node
      - uses: actions/upload-artifact@v7
        with:
          name: camera-node-firmware
          path: |
            camera-node/build/flash_args
            camera-node/build/*.bin
            camera-node/build/bootloader/bootloader.bin
            camera-node/build/partition_table/partition-table.bin

  master-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Creates a west workspace from master-node/west.yml and installs the Zephyr SDK
      - uses: zephyrproject-rtos/action-zephyr-setup@v1.0.15
        with:
          app-path: master-node
          toolchains: arm-zephyr-eabi
      - run: west build -b xiao_ble master-node -d master-node/build
      - uses: actions/upload-artifact@v7
        with:
          name: master-node-firmware
          path: |
            master-node/build/zephyr/zephyr.uf2
            master-node/build/zephyr/zephyr.hex

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      # Production images (compose itself runs the dev setup from source)
      - run: docker build -t backend ./backend
      - run: docker build -t frontend ./frontend
