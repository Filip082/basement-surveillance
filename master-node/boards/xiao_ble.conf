# XIAO nRF52840 + Wio-SX1262 only (the nRF5340 DK has no such parts)

# LoRa radio (Wio-SX1262, see boards/xiao_ble.overlay)
CONFIG_LORA=y

# Hide the USB driver's INF chatter (Reset / SUSPEND / RESUMING); keep warnings
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# Picture wake pulse from PCF8575 P06: short LOW for 30 ms.
# Battery request keeps APP_BATTERY_WAKE_PULSE_MS=300 (unchanged).
CONFIG_APP_IMAGE_WAKE_PULSE_MS=30
