# Wio-SX1262 wiring comes from boards/xiao_ble.overlay.
CONFIG_LORA=y
# Pin the backend used by the minimal raw-sync-word compatibility adapter.
CONFIG_LORA_MODULE_BACKEND_LORAMAC_NODE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Keep USB driver warnings without its routine reset/suspend/resume messages.
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_MAIN_STACK_SIZE=4096

# Temporary test sender. The board supplies the USB CDC ACM console.
CONFIG_APP_LORA_DEMO=y

# Temporary fast radio testing. Restore both duty fractions to 10 for the 1% profile.
CONFIG_APP_LORA_DUTY_PERMILLE=0
CONFIG_APP_ROUTER_DUTY_PERMILLE=0
# Test a new ENTRY one second after the previous session completes.
CONFIG_APP_DEMO_INTERVAL_SECONDS=1
