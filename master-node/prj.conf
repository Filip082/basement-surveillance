# ---- Logging ---------------------------------------------------------------
# One switch for all logs: CONFIG_LOG=n removes every LOG_xxx() call from the build
# (and the logging subsystem itself). Keep it on while developing.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ---- Bluetooth: central, one connection, bonding stored in flash -----------
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

# Pairing (LE Secure Connections, "Just Works") + bonds that survive power loss
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Big ATT MTU + long data packets: the camera sends (MTU - 6)-byte chunks, so a
# bigger MTU means far fewer packets for a 60 KB picture
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=7

# CRC32 of the received picture
CONFIG_CRC=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048


#wincej
CONFIG_LOG_BACKEND_UART=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_GPIO_PCF857X=y