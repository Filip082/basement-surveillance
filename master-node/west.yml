# West workspace manifest: pins the Zephyr version for everyone (devcontainer + CI).
# Only the modules this board needs are fetched, to keep the download small.
manifest:
  self:
    path: master-node

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      import:
        name-allowlist:
          - cmsis_6
          - hal_nordic
          - loramac-node
          - mbedtls        # crypto backend used by the Bluetooth host in recent Zephyr
          - open-amp       # nRF5340: IPC between the application and network core
          - libmetal       # needed by open-amp
          - tf-psa-crypto          # mbedtls 4.x keeps its crypto core in this module
          - tf-psa-crypto-drivers
